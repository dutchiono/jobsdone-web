name: Validate website rebuild

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate built sites and migrated features
        run: node tests/validate.mjs
      - name: Try to configure Pages for public preview (non-blocking)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "Pages already enabled."
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow >/dev/null && echo "Pages enabled." || echo "This token cannot enable Pages; repo administrator needs to configure Pages."
          fi
      - name: Check static preview hosting readiness (non-blocking)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '{status: .status, html_url: .html_url, source: .source}' ; then
            echo "GitHub Pages configuration is available."
          else
            echo "Pages is not configured or is not readable by this token; no public live URL may be claimed."
          fi
          curl -sS -L -o /dev/null -w 'Public preview URL response: %{http_code}\n' --max-time 12 https://dutchiono.github.io/jobsdone-web/ || true
      - name: Package reviewable website preview
        uses: actions/upload-artifact@v4
        with:
          name: jobsdone-miono-preview
          path: dist/
          if-no-files-found: error
