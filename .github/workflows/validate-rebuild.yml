name: Validate website rebuild

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate built sites and migrated features
        run: node tests/validate.mjs
      - name: Package reviewable website preview
        uses: actions/upload-artifact@v4
        with:
          name: jobsdone-miono-preview
          path: dist/
          if-no-files-found: error
